[project]
name = "setpoint"
version = "0.1.0.dev0"
description = "Measurement-driven configuration for local LLM inference. Finds the setpoint your hardware can actually hold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "llama.cpp", "gguf", "vram", "inference", "autotuning", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "nvidia-ml-py>=12.535.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The panel is an extra on purpose. `doctor` and `budget` have to keep working with
# nothing installed beyond the two runtime dependencies, so the interface cannot be
# allowed to make itself required.
tui = [
    "textual>=8.0",
]
# Chunking strategies come from an existing library rather than from us: the decision
# setpoint contributes is which of them to use on this hardware, not how to split text.
chunk = [
    "chonkie>=1.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Reference GGUF implementation. Not a runtime dependency: the test suite uses it
    # to write sample files and to check setpoint's own reader against it.
    "gguf>=0.10",
]

[project.scripts]
setpoint = "setpoint.cli:main"

[project.urls]
Homepage = "https://github.com/KadirEfeYazili/setpoint"
Issues = "https://github.com/KadirEfeYazili/setpoint/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setpoint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
